name: Windows release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the signed build as the latest GitHub release
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Use current Rust toolchain
        run: rustup update stable
      - name: Build signed release
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ./scripts/build-release.ps1 -UseEnvironmentKey
      - name: Save build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-windows-build
          path: .release/v*/*
          include-hidden-files: true
          if-no-files-found: error

  publish:
    needs: release
    if: ${{ inputs.publish }}
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-windows-build
          path: release-assets
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $manifest = @(Get-ChildItem -Path 'release-assets/v*/latest.json' -File)
          if ($manifest.Count -ne 1) { throw "Expected one release manifest; found $($manifest.Count)." }
          $version = (Get-Content -LiteralPath $manifest[0].FullName -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists." }
          $stage = $manifest[0].DirectoryName
          gh release create $tag `
            "$stage/Sheetview_${version}_x64-setup.exe" `
            "$stage/Sheetview_${version}_x64-setup.exe.sig" `
            "$stage/latest.json" `
            "$stage/SHA256SUMS.txt" `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "Sheetview $version" `
            --generate-notes `
            --latest
          if ($LASTEXITCODE -ne 0) { throw "Could not publish release $tag." }
