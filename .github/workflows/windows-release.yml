name: Windows release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the signed build as the latest GitHub release
        type: boolean
        required: true
        default: false

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Use current Rust toolchain
        run: rustup update stable
      - name: Build signed release
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ./scripts/build-release.ps1 -UseEnvironmentKey
      - name: Save build for verification
        if: ${{ !inputs.publish }}
        uses: actions/upload-artifact@v4
        with:
          name: signed-windows-build
          path: .release/v*/*
          if-no-files-found: error
      - name: Publish GitHub release
        if: ${{ inputs.publish }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $version = $config.version
          $tag = "v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists." }
          $stage = ".release/v$version"
          gh release create $tag `
            "$stage/Sheetview_${version}_x64-setup.exe" `
            "$stage/Sheetview_${version}_x64-setup.exe.sig" `
            "$stage/latest.json" `
            "$stage/SHA256SUMS.txt" `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "Sheetview $version" `
            --generate-notes `
            --latest
          if ($LASTEXITCODE -ne 0) { throw "Could not publish release $tag." }
