name: Windows release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the signed build as the latest GitHub release
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Use current Rust toolchain
        run: rustup update stable
      - name: Build signed release
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ./scripts/build-release.ps1 -UseEnvironmentKey
      - name: Save build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-windows-build
          path: .release/v*/*
          include-hidden-files: true
          if-no-files-found: error

  publish:
    needs: release
    if: ${{ inputs.publish }}
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: signed-windows-build
          path: release-assets
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $manifest = @(Get-ChildItem -Path 'release-assets/v*/latest.json' -File)
          if ($manifest.Count -ne 1) { throw "Expected one release manifest; found $($manifest.Count)." }
          $version = (Get-Content -LiteralPath $manifest[0].FullName -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists." }
          $stage = $manifest[0].DirectoryName
          gh release create $tag `
            "$stage/Sheetview_${version}_x64-setup.exe" `
            "$stage/Sheetview_${version}_x64-setup.exe.sig" `
            "$stage/latest.json" `
            "$stage/SHA256SUMS.txt" `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "Sheetview $version" `
            --generate-notes `
            --latest
          if ($LASTEXITCODE -ne 0) { throw "Could not publish release $tag." }
